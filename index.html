<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca & Guía ARGMU 99B - Anime Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&display=swap');

    :root {
      --bg-gradient: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: #6b11ff;
      --pink-neon: #ff007f;
      --cyan-neon: #00f0ff;
      --yellow-neon: #ffea00;
      --purple-accent: #6b11ff;
      --text-dark: #1e1035;
      --text-intro: #4a4a6a;
      --box-bg: #ffffff;
      --box-border: #e2e8f0;
      --stat-bg: #f1f5f9;
      --stat-border: #cbd5e1;
      --stat-text: #0f172a;
      --table-even: #f8fafc;
      --table-odd: #ffffff;
      --table-hover: #f1f5f9;
      --subtext: #64748b;
    }

    body.dark-mode {
      --bg-gradient: linear-gradient(135deg, #0f051d 0%, #171b30 100%);
      --card-bg: rgba(20, 20, 35, 0.92);
      --card-border: #00f0ff;
      --purple-accent: #a855f7;
      --text-dark: #f1f5f9;
      --text-intro: #cbd5e1;
      --box-bg: #1e1e38;
      --box-border: #334155;
      --stat-bg: #111827;
      --stat-border: #374151;
      --stat-text: #f8fafc;
      --table-even: #18182c;
      --table-odd: #1e1e38;
      --table-hover: #2a2a4a;
      --subtext: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-dark);
      font-family: 'Rajdhani', sans-serif;
      padding: 25px 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* PANTALLA DE LOGIN */
    #loginOverlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 5, 29, 0.95);
      backdrop-filter: blur(15px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .login-card {
      background: rgba(20, 20, 35, 0.95);
      border: 3px solid var(--cyan-neon);
      border-radius: 20px;
      padding: 35px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
      text-align: center;
    }

    .login-title {
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 20px;
      text-transform: uppercase;
      text-shadow: 0 0 10px var(--pink-neon);
    }

    .login-input {
      width: 100%;
      background: #111827;
      border: 2px solid #334155;
      border-radius: 12px;
      color: #fff;
      padding: 14px;
      font-size: 16px;
      font-family: 'Rajdhani', sans-serif;
      margin-bottom: 15px;
      outline: none;
      transition: border-color 0.3s ease;
    }

    .login-input:focus {
      border-color: var(--cyan-neon);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    .login-btn {
      width: 100%;
      background: linear-gradient(90deg, var(--pink-neon), #ff5252);
      color: #fff;
      border: 2px solid var(--yellow-neon);
      padding: 12px;
      border-radius: 12px;
      font-family: 'Orbitron', sans-serif;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .login-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 0 25px var(--pink-neon);
    }

    .login-error {
      color: #ff4d4d;
      font-size: 14px;
      font-weight: 700;
      margin-top: 10px;
      display: none;
    }

    .main-container {
      width: 100%;
      max-width: 900px;
      display: none; /* Oculto hasta iniciar sesión */
    }

    /* ENCABEZADO ANIME */
    .lib-header {
      text-align: center;
      margin-bottom: 25px;
    }

    .lib-title {
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 
        0 0 10px var(--pink-neon),
        0 0 20px var(--pink-neon),
        0 0 40px var(--cyan-neon);
      margin-bottom: 20px;
    }

    /* NAVEGACIÓN PRINCIPAL */
    nav {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .nav-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 24px;
      border-radius: 50px;
      border: 2px solid #fff;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .nav-btn:hover {
      background: var(--cyan-neon);
      color: #000;
      border-color: #fff;
      box-shadow: 0 0 20px var(--cyan-neon);
      transform: translateY(-3px) scale(1.05);
    }

    .nav-btn.active {
      background: linear-gradient(90deg, var(--pink-neon), #ff5252);
      color: #fff;
      border-color: var(--yellow-neon);
      box-shadow: 0 0 25px var(--pink-neon);
      transform: scale(1.05);
    }

    .theme-toggle-btn {
      background: rgba(0, 0, 0, 0.4);
      border-color: var(--yellow-neon);
    }
    .theme-toggle-btn:hover {
      background: var(--yellow-neon);
      color: #000;
      box-shadow: 0 0 20px var(--yellow-neon);
    }

    .logout-btn {
      background: rgba(225, 29, 72, 0.4);
      border-color: #e11d48;
    }
    .logout-btn:hover {
      background: #e11d48;
      color: #fff;
      box-shadow: 0 0 20px #e11d48;
    }

    /* CONTENEDOR DE SECCIONES */
    section {
      display: none;
      background: var(--card-bg);
      border: 3px solid var(--card-border);
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3), inset 0 0 15px rgba(255,255,255,0.2);
      backdrop-filter: blur(12px);
      animation: animePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      transition: background 0.3s ease, border-color 0.3s ease;
    }

    section.active-section {
      display: block;
    }

    @keyframes animePop {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .section-title {
      font-family: 'Orbitron', sans-serif;
      color: var(--purple-accent);
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .section-intro {
      color: var(--text-intro);
      font-size: 15px;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 20px;
      border-bottom: 2px dashed rgba(107, 17, 255, 0.2);
      padding-bottom: 12px;
    }

    /* TARJETAS DE EVENTOS TIEMPO REAL */
    .events-grid-live {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .live-card {
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      transition: all 0.3s ease;
      position: relative;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .live-card-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .live-card-timer {
      font-size: 22px;
      font-weight: 900;
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* ESTADOS Y ANIMACIÓN DE DESTELLO EN BORDES */
    .live-card.status-normal {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      border: 2px solid #0284c7;
      color: #0369a1;
    }
    body.dark-mode .live-card.status-normal {
      background: linear-gradient(135deg, #0c4a6e 0%, #0369a1 100%);
      border: 2px solid #38bdf8;
      color: #e0f2fe;
    }

    .live-card.status-warning {
      background: linear-gradient(135deg, #fef9c3 0%, #fef08a 100%);
      border: 2px solid #ca8a04;
      color: #854d0e;
      animation: borderFlashWarning 1.2s infinite alternate ease-in-out;
    }
    body.dark-mode .live-card.status-warning {
      background: linear-gradient(135deg, #713f12 0%, #a16207 100%);
      border: 2px solid #facc15;
      color: #fef9c3;
    }

    @keyframes borderFlashWarning {
      0% {
        border-color: #ca8a04;
        box-shadow: 0 0 4px rgba(202, 138, 4, 0.3);
      }
      100% {
        border-color: #facc15;
        box-shadow: 0 0 18px #facc15, inset 0 0 8px rgba(250, 204, 21, 0.4);
      }
    }

    .live-card.status-danger {
      background: linear-gradient(135deg, #ffe4e6 0%, #fecdd3 100%);
      border: 2px solid #e11d48;
      color: #9f1239;
      animation: borderFlashDanger 0.8s infinite alternate ease-in-out;
    }
    body.dark-mode .live-card.status-danger {
      background: linear-gradient(135deg, #881337 0%, #be123c 100%);
      border: 2px solid #ff007f;
      color: #ffe4e6;
    }

    @keyframes borderFlashDanger {
      0% {
        border-color: #e11d48;
        box-shadow: 0 0 6px rgba(225, 29, 72, 0.4);
      }
      100% {
        border-color: #ff007f;
        box-shadow: 0 0 22px #ff007f, inset 0 0 10px rgba(255, 0, 127, 0.5);
      }
    }

    /* TAB CALCULADORA */
    .mu-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      background: rgba(107, 17, 255, 0.1);
      padding: 6px;
      border-radius: 14px;
    }

    .mu-tab {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 10px;
      color: var(--purple-accent);
      padding: 10px 0;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .mu-tab.active {
      background: var(--purple-accent);
      color: #fff;
      box-shadow: 0 4px 12px rgba(107, 17, 255, 0.4);
    }

    .mu-top-bar {
      display: grid;
      grid-template-columns: 1.4fr 0.9fr 1.1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 650px) {
      .mu-top-bar {
        grid-template-columns: 1fr;
      }
    }

    .mu-reset-box, .mu-points-box, .mu-select-account {
      background: var(--box-bg);
      border: 2px solid #3b82f6;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-dark);
      font-weight: 700;
      font-size: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .reset-label { 
      color: #2563eb; 
      font-weight: 800; 
      font-family: 'Orbitron';
      white-space: nowrap;
    }
    body.dark-mode .reset-label {
      color: #60a5fa;
    }

    .reset-controls-group { 
      display: flex; 
      align-items: center; 
      gap: 4px; 
    }

    .btn-reset-single {
      background: #2563eb;
      border: none;
      border-radius: 6px;
      color: #fff;
      width: 28px;
      height: 28px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.1s ease;
    }

    .btn-reset-single:active { transform: scale(0.9); }

    .mu-input-reset {
      width: 65px;
      background: transparent;
      border: none;
      color: #1d4ed8;
      font-weight: 900;
      font-size: 18px;
      text-align: center;
      outline: none;
      font-family: 'Orbitron';
      -moz-appearance: textfield;
    }
    body.dark-mode .mu-input-reset {
      color: #93c5fd;
    }

    .mu-input-reset::-webkit-outer-spin-button,
    .mu-input-reset::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .mu-select-account {
      cursor: pointer;
      font-weight: 800;
      outline: none;
      color: #9333ea;
      border-color: #a855f7;
    }
    body.dark-mode .mu-select-account {
      color: #c084fc;
      background-color: var(--box-bg);
    }

    .points-label { color: var(--subtext); font-family: 'Orbitron'; font-size: 13px; }
    .points-value { color: var(--pink-neon); font-weight: 900; font-size: 18px; font-family: 'Orbitron'; }

    .mu-select {
      width: 100%;
      background: var(--box-bg);
      border: 2px solid var(--purple-accent);
      border-radius: 12px;
      color: var(--text-dark);
      padding: 12px;
      font-size: 15px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
      margin-bottom: 20px;
    }

    /* BARRAS DE STATS */
    .stat-block {
      margin-bottom: 16px;
      background: var(--box-bg);
      border: 2px solid var(--box-border);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.05);
    }

    .stat-input-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mu-stat-box {
      flex: 1;
      background: var(--stat-bg);
      border: 2px solid var(--stat-border);
      border-radius: 30px;
      padding: 0 18px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 44px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
    }

    .stat-progress-bg {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1;
      border-radius: 30px;
      box-shadow: 0 0 12px rgba(255, 0, 127, 0.4);
    }

    .stat-progress-bg::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.6) 50%, rgba(255,255,255,0) 100%);
      border-radius: 30px;
      animation: shineBar 2s infinite linear;
    }

    @keyframes shineBar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    .mu-stat-name { 
      font-size: 15px; 
      font-weight: 800; 
      z-index: 2; 
      color: var(--stat-text); 
      font-family: 'Orbitron', sans-serif;
      text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }

    .mu-stat-value { 
      font-size: 18px; 
      font-weight: 900; 
      z-index: 2; 
      color: var(--stat-text);
